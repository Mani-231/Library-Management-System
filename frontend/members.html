
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members Management | Library System</title>
    <link rel="stylesheet" href="css/members.css">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>

    <aside class="sidebar">
        <h2>LibManager</h2>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="books.html">Books</a>
            <a href="members.html" class="active">Members</a>
            <a href="#">Issue Books</a>
            <a href="#">Return Books</a>
            <a href="#">Transactions</a>
            <a href="#">Reports</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Members Management</h1>
                <p>Manage registered library members</p>
            </div>
            <span class="user-label">Librarian</span>
        </header>

        <section class="content">

            <div class="section-heading">
                <div>
                    <h2>All Members</h2>
                    <p>View and register library members.</p>
                </div>

                <button id="showFormButton">+ Add New Member</button>
            </div>

            <div class="form-card" id="memberFormCard" hidden>
                <h2>Register New Member</h2>

                <form id="memberForm">
                    <div class="form-grid">

                        <div>
                            <label for="name">Member Name *</label>
                            <input type="text" id="name" required>
                        </div>

                        <div>
                            <label for="email">Email Address</label>
                            <input type="email" id="email">
                        </div>

                        <div>
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone">
                        </div>

                    </div>

                    <div class="form-actions">
                        <button type="submit">Save Member</button>

                        <button type="button" class="cancel-button"
                            id="cancelButton">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>

            <div id="message" class="message" aria-live="polite"></div>

            <div class="table-card">
                <div class="table-header">
                    <h2>Member Records</h2>
                    <span id="memberCount">Loading...</span>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Member ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                            </tr>
                        </thead>

                        <tbody id="membersTableBody">
                            <tr>
                                <td colspan="4">Loading members...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <script src="js/members.js"></script>
</body>
</html>
